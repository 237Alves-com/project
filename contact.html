<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10152b">
  <title>Contact | Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 90px 18px 36px; color: #f7f8ff; background: #10152b; background-image: radial-gradient(ellipse at 18% 15%, #533b9b88 0, transparent 38%), radial-gradient(ellipse at 85% 84%, #0869e866 0, transparent 38%); }
    body::before { content: ""; position: fixed; inset: 0; opacity: .15; pointer-events: none; background-image: linear-gradient(#ffffff12 1px, transparent 1px), linear-gradient(90deg, #ffffff12 1px, transparent 1px); background-size: 52px 52px; mask-image: linear-gradient(to bottom, black, transparent 90%); }
    nav { position: absolute; top: 24px; left: 50%; z-index: 2; display: flex; gap: 8px; transform: translateX(-50%); }
    nav a { padding: 10px 16px; border: 1px solid #ffffff1c; border-radius: 999px; color: #e5e7f4; font-size: 14px; text-decoration: none; background: #ffffff09; transition: background .2s, border-color .2s; }
    nav a:hover, nav a[aria-current="page"] { border-color: #ffffff45; background: #ffffff19; }
    main { position: relative; width: min(680px, 100%); padding: clamp(32px, 7vw, 64px); border: 1px solid #ffffff20; border-radius: 28px; background: linear-gradient(145deg, #ffffff12, #ffffff06); box-shadow: 0 30px 100px #05071477, inset 0 1px #ffffff1b; backdrop-filter: blur(18px); animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin: 0 0 14px; color: #b5a7ff; font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(42px, 8vw, 68px); line-height: 1.05; letter-spacing: -.06em; }
    h1 span { color: transparent; background: linear-gradient(100deg, #b5a7ff 12%, #72d7ff 90%); background-clip: text; }
    .intro { margin: 18px 0 30px; color: #c2c6db; font-size: 17px; line-height: 1.7; }
    form { display: grid; gap: 17px; }
    label { display: grid; gap: 8px; color: #e5e7f4; font-size: 14px; font-weight: 600; }
    input, textarea { width: 100%; padding: 13px 15px; border: 1px solid #ffffff24; border-radius: 12px; outline: none; color: #f7f8ff; font: inherit; background: #090d1e66; transition: border-color .2s, box-shadow .2s; }
    input::placeholder, textarea::placeholder { color: #858ca8; }
    input:focus, textarea:focus { border-color: #9b8cff; box-shadow: 0 0 0 3px #8c6bff2a; }
    textarea { min-height: 125px; resize: vertical; }
    button { justify-self: start; padding: 13px 20px; border: 0; border-radius: 12px; color: #10152b; font: inherit; font-weight: 700; cursor: pointer; background: linear-gradient(100deg, #b5a7ff, #72d7ff); box-shadow: 0 9px 24px #735cff44; transition: transform .2s, box-shadow .2s; }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px #735cff66; }
    .note { margin: 18px 0 0; color: #9299b5; font-size: 13px; line-height: 1.5; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 600px) { nav { top: 16px; width: calc(100% - 32px); justify-content: center; } nav a { padding: 9px 12px; font-size: 13px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <p class="eyebrow">We’d love to hear from you</p>
    <h1>Say <span>hello.</span></h1>
    <p class="intro">Have a question, an idea, or just want to say hi? Send a note using the form below.</p>
    <form action="mailto:hello@example.com" method="post" enctype="text/plain">
      <label for="name">Your name<input id="name" name="name" type="text" autocomplete="name" placeholder="Alex Morgan" required></label>
      <label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="alex@example.com" required></label>
      <label for="message">Message<textarea id="message" name="message" placeholder="What’s on your mind?" required></textarea></label>
      <button type="submit">Send a message <span aria-hidden="true">→</span></button>
    </form>
    <p class="note">This demo opens your email app to send the message. Update the address in this page’s form action to use your own.</p>
  </main>
</body>
</html>
